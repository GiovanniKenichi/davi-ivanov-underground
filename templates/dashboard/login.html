{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo | Davi Ivanov</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: #090909;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #121212;
            border: 1px solid #292929;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #D4AF37;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
            margin-bottom: 4px;
        }

        .logo p {
            color: #D4AF37;
            font-size: 11px;
            letter-spacing: 5px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .titulo span {
            color: #999;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cccccc;
        }

        .campo input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #303030;
            background: #1a1a1a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #D4AF37;
        }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            background: #D4AF37;
            color: #111;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #e7c34d;
            transform: translateY(-2px);
        }

        .erro {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff8c97;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .voltar:hover {
            color: #D4AF37;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">✂</div>

            <h1>Davi Ivanov</h1>

            <p>BARBEARIA PREMIUM</p>

        </div>

        <div class="titulo">

            <h2>Área Administrativa</h2>

            <span>Faça login para acessar o painel</span>

        </div>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="campo">

                <label>Usuário</label>

                <input
                    type="text"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    required
                >

            </div>

            <div class="campo">

                <label>Senha</label>

                <input
                    type="password"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <button type="submit" class="btn-login">
                Entrar no Painel
            </button>

        </form>

        <a href="{% url 'home' %}" class="voltar">
            ← Voltar para o site
        </a>

    </div>

</body>

</html>
