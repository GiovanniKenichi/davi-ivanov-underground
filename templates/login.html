<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Administrativo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}

body{

background:#090909;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.login{

width:420px;
background:#111;
padding:45px;
border-radius:18px;
border:1px solid #222;
box-shadow:0 0 40px rgba(0,0,0,.45);

}

.login h1{

color:#D4AF37;
text-align:center;
margin-bottom:35px;
font-size:34px;

}

input{

width:100%;
padding:15px;
margin-bottom:18px;
background:#1b1b1b;
border:none;
border-radius:10px;
color:#fff;
font-size:15px;

}

input:focus{

outline:2px solid #D4AF37;

}

button{

width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#D4AF37;
color:#000;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:translateY(-2px);

}

.erro{

background:#dc3545;
padding:12px;
border-radius:8px;
margin-bottom:18px;
text-align:center;
color:#fff;

}

.logo{

text-align:center;
font-size:60px;
margin-bottom:15px;

}

</style>

</head>

<body>

<div class="login">

<div class="logo">

💈

</div>

<h1>Painel Administrativo</h1>

{% if erro %}

<div class="erro">

{{ erro }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="usuario"
placeholder="Usuário"
required>

<input
type="password"
name="senha"
placeholder="Senha"
required>

<button>

Entrar

</button>

</form>

</div>

</body>

</html>
